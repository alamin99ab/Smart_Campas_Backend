# Smart Campus API - Render Blueprint (Production Safe)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: smart-campus-api
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health

    envVars:
      # Core runtime
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001

      # Database
      - key: MONGO_URI
        sync: false

      # Auth / security
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: JWT_REFRESH_EXPIRE
        value: 30d
      - key: AUTH_LOGIN_RATE_LIMIT_WINDOW_MS
        value: 300000
      - key: AUTH_LOGIN_RATE_LIMIT_MAX
        value: 10
      - key: BCRYPT_ROUNDS
        value: 12
      - key: SESSION_SECRET
        generateValue: true

      # Super admin (must be set in Render dashboard)
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_NAME
        value: Super Admin
      - key: SUPER_ADMIN_PHONE
        sync: false

      # CORS
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOW_ALL_ORIGINS
        value: false

      # Seeding (opt-in only, safe defaults)
      - key: SEED_ON_STARTUP
        value: false
      - key: FORCE_SEED_RESET
        value: false
      # Legacy alias support in code; keep false to avoid accidental reset
      - key: AUTO_SEED_TEST_DATA
        value: false
      - key: AUTO_SEED_RESET_DATA
        value: false
      - key: SEED_TEST_PASSWORD
        sync: false

      # Email (optional)
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_SECURE
        value: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

      # Cloud storage (optional)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # AI (optional)
      - key: OPENAI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: AI_SERVICE_URL
        sync: false

      # SMS (optional)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

      # Feature flags
      - key: REQUIRE_EMAIL_VERIFICATION
        value: false
      - key: SEND_ABSENT_SMS
        value: false
      - key: SEND_PAYMENT_RECEIPT
        value: true
      - key: ENABLE_AI_FEATURES
        value: true
      - key: ENABLE_REAL_TIME_NOTIFICATIONS
        value: true

      # Logging
      - key: LOG_LEVEL
        value: info

    disk:
      name: smart-campus-uploads
      mountPath: /app/uploads
      sizeGB: 10
